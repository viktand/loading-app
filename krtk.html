<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КРТК на ЖД платформах — скоро</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --text: #1f2328;
    --muted: #656d76;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
  }
  .icon {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 16px;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  h1 {
    font-size: 26px;
    margin: 0 0 8px;
  }
  .subtitle {
    color: var(--accent);
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  p {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 15px;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid var(--accent);
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚃</div>
    <div class="subtitle">В разработке</div>
    <h1>КРТК на ЖД платформах</h1>
    <p>Скоро здесь появится калькулятор размещения крупнотоннажных контейнеров на железнодорожных платформах. Следите за обновлениями!</p>
    <a href="index.html" class="btn">← На главную</a>
  </div>
</body>
</html>
