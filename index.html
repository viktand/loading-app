<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькуляторы погрузки</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 40px 20px; color: #1f2328; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  .sub { color: #656d76; margin-bottom: 28px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card {
    background: #fff; border: 1px solid #d0d7de; border-radius: 10px;
    padding: 24px; text-decoration: none; color: inherit;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover { border-color: #0969da; box-shadow: 0 6px 20px rgba(9,105,218,.12); transform: translateY(-2px); }
  .card .icon { font-size: 32px; margin-bottom: 10px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .card p { margin: 0; color: #656d76; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Калькуляторы погрузки</h1>
  <div class="sub">Выберите инструмент</div>
  <div class="cards">
    <a class="card" href="rolls.html">
      <div class="icon">🧻</div>
      <h2>Рулоны в КТК</h2>
      <p>Оптимизация погрузки рулонов в контейнеры по массе и диаметру.</p>
    </a>
    <a class="card" href="krtk-setup.html">
      <div class="icon">🚃</div>
      <h2>КТК на ЖД платформах</h2>
      <p>Размещение крупнотоннажных контейнеров на железнодорожных платформах.</p>
    </a>
  </div>
</div>
</body>
</html>
