<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КТК на ЖД платформах — размещение</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --text: #1f2328;
    --muted: #656d76;
    --ok: #1a7f37;
    --warn: #9a6700;
    --err: #cf222e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat { background: var(--bg); border-radius: 6px; padding: 12px; }
  .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }
  .btn {
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid transparent;
    text-decoration: none;
    display: inline-block;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-secondary { background: #fff; color: var(--accent); border-color: var(--accent); }
  .btn-secondary:hover { background: #f0f6ff; }

  .platform-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: #fafbfc;
  }
  .platform-header {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .slots {
    display: flex;
    gap: 8px;
    min-height: 54px;
    background: #eef1f4;
    padding: 6px;
    border-radius: 6px;
    border: 1px dashed var(--border);
  }
  .ktk-box {
    background: #fff;
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .ktk-box.empty { border-color: var(--warn); background: #fffaf0; }
  .warn { color: var(--err); font-weight: 600; }
</style>
</head>
<body>
<script src="js/rules.js"></script> 
<script src="js/solver.js"></script>

<div class="container">
  <h1>КТК на ЖД платформах — размещение</h1>
  <div class="subtitle">Этап 2: распределение сгенерированной партии по фитинговым платформам.</div>

  <!-- Ошибка, если страница открыта без данных из krtk.html -->
  <div id="noDataError" class="card" style="display:none;">
    <p class="warn">Список контейнеров не найден. Сначала сформируйте партию на этапе 1.</p>
    <a href="krtk-setup.html" class="btn btn-secondary">← К параметрам партии</a>
  </div>

  <!-- Основной блок -->
  <div id="main" style="display:none;">
    <div class="card">
      <div class="summary" id="summary"></div>
      <div class="toolbar">
        <button id="calcBtn" class="btn btn-primary">▶ Рассчитать размещение</button>
        <button onclick="history.back()" class="btn btn-secondary">← Назад к списку КТК</button>
        <a href="krtk-setup.html" class="btn btn-secondary">Изменить параметры</a>
      </div>
      <div id="resultArea"></div>
    </div>
  </div>
</div>

<script>
"use strict";

// ===================== ЧТЕНИЕ ДАННЫХ ИЗ SESSION STORAGE =====================
const raw = sessionStorage.getItem("ktk_batch");
let payload = null;

try {
  if (raw) payload = JSON.parse(raw);
} catch (e) {
  console.error("Ошибка чтения ktk_batch:", e);
}

if (!payload || !Array.isArray(payload.items) || payload.items.length === 0) {
  document.getElementById("noDataError").style.display = "";
} else {
  document.getElementById("main").style.display = "";
  init(payload);
}

// ===================== ВЫВОД =====================

function renderSummary(items, res) {
  const totalMass = items.reduce((s, x) => s + x.massT, 0);
  const cards = [
    { label: "Всего КТК", value: items.length },
    { label: "Общая масса, т", value: totalMass.toFixed(2) },
    { label: "Сформировано платформ", value: res.platforms.length },
    { label: "В остатке (не размещено)", value: res.unplaced.length },
  ];
  document.getElementById("summary").innerHTML = cards.map(c => `
    <div class="stat">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
    </div>`).join("");
}

function renderResult(res) {
  const area = document.getElementById("resultArea");

  // 1. Отрисовка сформированных платформ
  const platformsHtml = res.platforms.map(p => {
    const boxes = p.containers.map(c => {
      const widthPct = Math.min(100, (c.lengthM / 24.4) * 100).toFixed(1);
      return `
        <div class="ktk-box ${c.isEmpty ? "empty" : ""}" style="width: ${widthPct}%;">
          <strong>#${c.id} (${c.type}')</strong>
          <span>${c.isEmpty ? "пор. (" + c.massT.toFixed(1) + " т)" : c.massT.toFixed(2) + " т"} | ЦТ: ${c.cgMm} мм</span>
        </div>`;
    }).join("");

    // Определяем выравнивание для каждой конкретной платформы:
    const justify = p.centered
      ? "center"
      : (p.edgeAligned ? "space-between" : "flex-start");

    return `
      <div class="platform-card">
        <div class="platform-header">
          <span>Платформа №${p.index} — ${p.ruleApplied}</span>
          <span>Масса: ${p.totalMassT.toFixed(2)} / 69.0 т &nbsp;|&nbsp; ${p.meta}</span>
        </div>
        <div class="slots" style="justify-content: ${justify};">${boxes}</div>
      </div>`;
  }).join("");
  
  // 2. Отрисовка неразмещённого остатка
  const unplacedHtml = res.unplaced.length === 0 ? "" : `
    <div class="platform-card" style="border-style: dashed; margin-top: 20px;">
      <div class="platform-header">
        <span>Ожидают размещения (${res.unplaced.length} шт.)</span>
        <span style="color: var(--muted); font-weight: 400;">Не попали в текущие правила</span>
      </div>
      <div class="slots" style="flex-wrap: wrap;">
        ${res.unplaced.map(c => `
          <div class="ktk-box ${c.isEmpty ? "empty" : ""}">
            <strong>#${c.id} (${c.type}')</strong>
            <span>${c.isEmpty ? "порожний" : c.massT.toFixed(2) + " т"} | ЦТ: ${c.cgMm} мм</span>
          </div>`).join("")}
      </div>
    </div>`;

  area.innerHTML = (platformsHtml || "<p>По текущим правилам платформ не сформировано.</p>") + unplacedHtml;
}

function init(data) {
  const run = () => {
    // ВОТ ЗДЕСЬ ВЫЗЫВАЕТСЯ РЕШАТЕЛЬ ИЗ js/solver.js:
    const res = window.KTK.Solver.solve(data.items, data.params);

    renderSummary(data.items, res);
    renderResult(res);
  };

  document.getElementById("calcBtn").addEventListener("click", run);
  run();
}
</script>
</body>
</html>
